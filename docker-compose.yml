services:
  ser:
    build: .
    image: crema-ser:latest
    working_dir: /workspace/MT_mid_pj
    volumes:
      - .:/workspace/MT_mid_pj
      - ${CREMA_DATA_DIR:-./data}:/data/crema-d:ro
      - ./outputs:/workspace/MT_mid_pj/outputs
    ports:
      - "8501:8501"
      - "6006:6006"
    environment:
      DATA_DIR: /data/crema-d
      OUTPUT_DIR: /workspace/MT_mid_pj/outputs
      PYTHONPATH: /workspace/MT_mid_pj/src
    command: bash
    stdin_open: true
    tty: true
